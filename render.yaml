services:
  - type: web
    name: askmaya-cleaning-services
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
